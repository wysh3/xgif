<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Convert public X videos to GIFs and animated WebP stickers on your device.">
  <meta property="og:title" content="xgif — X video to GIF">
  <meta property="og:description" content="Make looping GIFs and animated stickers from X videos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wysh3.github.io/xgif/">
  <meta property="og:image" content="https://wysh3.github.io/xgif/share.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://wysh3.github.io/xgif/">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>xgif — X video to GIF</title>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="link" viewBox="0 0 24 24"><path d="M10 13.5l4-4m1-3 2-2a3.5 3.5 0 0 1 5 5l-4 4a3.5 3.5 0 0 1-5 0m-4 4-2 2a3.5 3.5 0 0 1-5-5l4-4a3.5 3.5 0 0 1 5 0"/></symbol>
    <symbol id="source" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/></symbol>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="options-icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16m-12-12v4m7 1v4m-5 1v4"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="share-icon" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M7 10H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2"/></symbol>
  </svg>

  <div class="shell">
    <header class="topbar">
      <span class="wordmark"><span class="signal-mark" aria-hidden="true"><i></i><i></i><i></i></span>xgif</span>
      <a class="icon-button" href="https://github.com/wysh3/xgif" aria-label="Source code on GitHub" title="Source code on GitHub">
        <svg class="icon" aria-hidden="true"><use href="#source"/></svg>
      </a>
    </header>

    <main class="workspace">
      <section class="console" aria-labelledby="title">
        <h1 id="title">X video to GIF</h1>
        <p class="intro">From a public X post or a video file.</p>

        <form id="converter">
          <fieldset id="controls">
            <label class="visually-hidden" for="post">X post link</label>
            <div class="command">
              <svg class="icon" aria-hidden="true"><use href="#link"/></svg>
              <input id="post" type="url" inputmode="url" placeholder="Paste an X post link" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="status">
              <span id="file-name" hidden></span>
              <button id="remove-file" class="icon-button" type="button" aria-label="Remove video" hidden><svg class="icon" aria-hidden="true"><use href="#close"/></svg></button>
              <button id="convert" class="primary" type="submit" aria-label="Paste &amp; convert">
                <span id="convert-text">Paste</span><svg class="icon" aria-hidden="true"><use href="#arrow"/></svg>
              </button>
            </div>
            <div class="toolbar">
              <fieldset class="formats">
                <legend class="visually-hidden">Output format</legend>
                <label><input type="radio" name="format" value="gif" checked><span>GIF</span></label>
                <label><input type="radio" name="format" value="webp"><span>Sticker</span></label>
              </fieldset>
              <button id="toggle-options" class="icon-button" type="button" aria-label="Options" title="Options" aria-haspopup="dialog" aria-expanded="false" aria-controls="options">
                <svg class="icon" aria-hidden="true"><use href="#options-icon"/></svg>
              </button>
            </div>
            <label id="clip-picker" class="clip-picker" hidden>Video in post <select id="clip"></select></label>

            <dialog id="options" aria-labelledby="options-title">
              <header><h2 id="options-title">Options</h2><button id="close-options" class="secondary" type="button">Done</button></header>
              <div class="toolbar">
                <button id="choose-video" class="secondary" type="button">Open video…</button>
                <input id="file" type="file" accept="video/*,.mov,.mkv" hidden>
                <button id="toggle-trim" class="secondary" type="button" aria-controls="trim-options" aria-expanded="false">Trim clip</button>
              </div>
              <div id="trim-options" class="trim-options" hidden>
                <label>Start (seconds)<input id="start" type="number" min="0" step="0.1" value="0" required></label>
                <label>Length (seconds)<input id="length" type="number" min="0.5" max="10" step="0.1" value="3" required></label>
              </div>
            </dialog>
          </fieldset>
        </form>

        <div class="activity">
          <p id="status" role="status" aria-live="polite"></p>
          <div id="working" class="working" hidden>
            <progress id="progress" aria-label="Conversion progress"></progress>
            <button id="cancel" class="secondary" type="button">Cancel</button>
          </div>
        </div>
      </section>

      <div class="hero-art" aria-hidden="true">
        <picture id="art">
          <source media="(max-width: 680px)" srcset="/src/assets/signal-small.webp">
          <img src="/src/assets/signal.webp" alt="" width="736" height="1314" fetchpriority="high">
        </picture>
      </div>
      <span class="drop-hint" aria-hidden="true">Drop video</span>
      <section id="result" aria-labelledby="result-name" tabindex="-1" hidden>
        <div class="preview"><img id="preview" alt="Converted animation"></div>
        <div class="result-bar">
          <div><h2 id="result-name"></h2><span id="result-size"></span></div>
          <div class="result-actions">
            <a id="save" class="secondary" download><svg class="icon" aria-hidden="true"><use href="#download"/></svg>Save</a>
            <button id="copy" class="secondary" type="button" hidden>Copy</button>
            <button id="share" class="primary" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#share-icon"/></svg>Share</button>
          </div>
        </div>
        <p id="result-help" hidden></p>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
