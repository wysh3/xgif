<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Convert public X videos to GIFs and animated WebP stickers on your device.">
  <meta property="og:title" content="xgif">
  <meta property="og:description" content="Make looping GIFs and animated stickers from X videos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wysh3.github.io/xgif/">
  <meta property="og:image" content="https://wysh3.github.io/xgif/share.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://wysh3.github.io/xgif/">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>xgif</title>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13.5l4-4m.5-3 1.2-1.2a3.5 3.5 0 0 1 5 5l-3.6 3.6m-7.6 3.6-1.2 1.2a3.5 3.5 0 0 1-5-5l3.6-3.6"/></symbol>
    <symbol id="icon-loop" viewBox="0 0 24 24"><path d="M20 7H8a4 4 0 0 0-4 4m12-8 4 4-4 4M4 17h12a4 4 0 0 0 4-4M8 13l-4 4 4 4"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M9 4v4m6 2v4m-7 2v4"/></symbol>
    <symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/></symbol>
    <symbol id="icon-paste" viewBox="0 0 24 24"><path d="M9 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3M9 13h6m-6 4h6"/><rect x="8" y="3" width="8" height="5" rx="1.5"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="icon-share" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M7 10H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2"/></symbol>
    <symbol id="icon-sticker" viewBox="0 0 24 24"><path d="M21 13.5 13.5 21H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6.5z"/><path d="M13.5 21v-5.5a2 2 0 0 1 2-2H21M8 8h.01m5.99 0h.01M8 13a4 4 0 0 0 4 2"/></symbol>
  </svg>
  <header class="site-header">
    <div class="brand"><img src="./icon.svg" width="31" height="31" alt=""><span>xgif</span></div>
    <div class="utilities">
      <button id="choose-video" class="tool-button" type="button" aria-label="Open video" title="Open video"><svg class="icon" aria-hidden="true"><use href="#icon-file"/></svg><span>open file</span></button>
      <button id="toggle-options" class="tool-button icon-only" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="options"><svg class="icon" aria-hidden="true"><use href="#icon-settings"/></svg></button>
      <a class="tool-button icon-only" href="https://github.com/wysh3/xgif" aria-label="Source code on GitHub" title="Source code on GitHub"><svg class="icon" aria-hidden="true"><use href="#icon-code"/></svg></a>
    </div>
  </header>

  <main class="workspace">
    <div class="converter-view">
      <h1>Video to GIF or sticker</h1>

      <form id="converter">
        <fieldset id="controls">
          <legend class="visually-hidden">Conversion</legend>
          <label class="input-label" for="post">X post link</label>
          <div class="command">
            <svg class="icon input-icon" aria-hidden="true"><use href="#icon-link"/></svg>
            <input id="post" type="url" inputmode="url" autocomplete="off" spellcheck="false" autocapitalize="off" maxlength="512" aria-describedby="status">
            <span id="file-name" hidden></span>
            <button id="remove-file" class="clear-button" type="button" aria-label="Clear link" hidden><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
            <button id="convert" class="convert-button" type="submit" aria-label="Convert" hidden><span>convert</span></button>
          </div>

          <div class="action-row">
            <fieldset class="formats">
              <legend class="visually-hidden">Output format</legend>
              <label><input type="radio" name="format" value="gif" checked><span><svg class="icon gif" aria-hidden="true"><use href="#icon-loop"/></svg>gif</span></label>
              <label><input type="radio" name="format" value="webp"><span><svg class="icon sticker" aria-hidden="true"><use href="#icon-sticker"/></svg>sticker</span></label>
            </fieldset>
            <button id="paste" class="button" type="button"><svg class="icon clipboard" aria-hidden="true"><use href="#icon-paste"/></svg><span>paste &amp; convert</span></button>
          </div>
          <label id="clip-picker" class="clip-picker" hidden>video in post <select id="clip"></select></label>
          <input id="file" type="file" accept="video/*,.mov,.mkv" hidden>

          <dialog id="options" aria-labelledby="options-title" closedby="any">
            <div class="dialog-header">
              <h2 id="options-title">settings</h2>
              <button id="close-options" class="button" type="button" autofocus>done</button>
            </div>
            <div class="setting-card">
              <button id="toggle-trim" class="setting-row" type="button" aria-controls="trim-options" aria-expanded="false">trim clip <span aria-hidden="true">›</span></button>
              <div id="trim-options" class="trim-options" hidden>
                <label>Start (seconds)<input id="start" type="number" min="0" step="0.1" value="0" required></label>
                <label>Length (seconds)<input id="length" type="number" min="0.5" max="10" step="0.1" value="3" required></label>
              </div>
            </div>
          </dialog>
        </fieldset>
      </form>

      <div class="activity">
        <p id="status" role="status"></p>
        <div id="working" class="working" hidden>
          <progress id="progress" aria-label="Conversion progress" max="1"></progress>
          <button id="cancel" class="button" type="button">cancel</button>
        </div>
      </div>

      <section id="result" aria-labelledby="result-name" tabindex="-1" hidden>
        <div class="preview"><img id="preview" alt="Converted animation"></div>
        <div class="result-bar">
          <div><h2 id="result-name"></h2><span id="result-size"></span></div>
          <div class="result-actions">
            <a id="save" class="button" download><svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg>save</a>
            <button id="copy" class="button" type="button" hidden>copy</button>
            <button id="share" class="button primary" type="button" hidden><svg class="icon" aria-hidden="true"><use href="#icon-share"/></svg>share</button>
          </div>
        </div>
        <p id="result-help" hidden></p>
      </section>
    </div>

    <span class="drop-hint" aria-hidden="true">drop a video</span>
    <footer>interface adapted from <a href="https://github.com/imputnet/cobalt/tree/a636575/web">cobalt</a> · <a href="./licenses/cobalt-web.txt">license</a></footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
