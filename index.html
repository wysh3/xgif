<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Convert public X videos to GIFs and animated WebP stickers on your device.">
  <meta property="og:title" content="xgif">
  <meta property="og:description" content="Make looping GIFs and animated stickers from X videos.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wysh3.github.io/xgif/">
  <meta property="og:image" content="https://wysh3.github.io/xgif/share.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://wysh3.github.io/xgif/">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <title>xgif</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <span class="wordmark"><span class="icon" aria-hidden="true">[~]</span><span data-ascii>xgif</span></span>
      <a class="icon-button" href="https://github.com/wysh3/xgif" aria-label="Source code on GitHub" title="Source code on GitHub">
        <span class="icon" aria-hidden="true">&lt;/&gt;</span>
      </a>
    </header>

    <main class="workspace">
      <section class="console" aria-labelledby="title">
        <h1 id="title"><span data-ascii>X video</span> <span data-ascii>to GIF</span></h1>
        <form id="converter">
          <fieldset id="controls">
            <label class="visually-hidden" for="post">X post link</label>
            <div class="command">
              <span class="icon" aria-hidden="true">&gt;</span>
              <input id="post" type="url" inputmode="url" placeholder="X post link" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="status">
              <span class="command-placeholder" data-ascii aria-hidden="true">X post link</span>
              <span id="file-name" hidden></span>
              <button id="remove-file" class="icon-button" type="button" aria-label="Remove video" hidden><span class="icon" aria-hidden="true">[x]</span></button>
              <button id="convert" class="primary" type="submit" aria-label="Paste &amp; convert">
                <span id="convert-text" data-ascii>Paste</span><span class="icon" aria-hidden="true">-&gt;</span>
              </button>
            </div>
            <div class="toolbar action-row">
              <fieldset class="formats">
                <legend class="visually-hidden">Output format</legend>
                <label><input type="radio" name="format" value="gif" checked><span data-ascii>GIF</span></label>
                <label><input type="radio" name="format" value="webp"><span data-ascii>Sticker</span></label>
              </fieldset>
              <button id="toggle-options" class="icon-button" type="button" aria-label="Options" title="Options" aria-haspopup="dialog" aria-expanded="false" aria-controls="options">
                <span class="icon" aria-hidden="true">[=]</span>
              </button>
            </div>
            <label id="clip-picker" class="clip-picker" hidden><span data-ascii>Video in post</span><select id="clip"></select></label>

            <dialog id="options" aria-labelledby="options-title" closedby="any">
              <header><h2 id="options-title" data-ascii>Options</h2><button id="close-options" class="secondary" type="button"><span data-ascii>Done</span></button></header>
              <div class="option-actions">
                <button id="choose-video" class="option-row" type="button"><span class="icon" aria-hidden="true">[/]</span><span data-ascii>Open video</span><span class="icon chevron" aria-hidden="true">&gt;</span></button>
                <input id="file" type="file" accept="video/*,.mov,.mkv" hidden>
                <button id="toggle-trim" class="option-row" type="button" aria-controls="trim-options" aria-expanded="false"><span class="icon" aria-hidden="true">[|]</span><span data-ascii>Trim clip</span><span class="icon chevron" aria-hidden="true">&gt;</span></button>
              </div>
              <div id="trim-options" class="trim-options" hidden>
                <label><span data-ascii="Start sec">Start (seconds)</span><input id="start" type="number" min="0" step="0.1" value="0" required></label>
                <label><span data-ascii="Length sec">Length (seconds)</span><input id="length" type="number" min="0.5" max="10" step="0.1" value="3" required></label>
              </div>
            </dialog>
          </fieldset>
        </form>

        <div class="activity">
          <p id="status" role="status" aria-live="polite"></p>
          <div id="working" class="working" hidden>
            <progress id="progress" aria-label="Conversion progress"></progress>
            <button id="cancel" class="secondary" type="button"><span data-ascii>Cancel</span></button>
          </div>
        </div>
      </section>

      <div class="viewer">
        <div class="hero-art" aria-hidden="true">
          <picture id="art" hidden>
            <source media="(max-width: 680px)" srcset="/src/assets/signal-small.webp">
            <img src="/src/assets/signal.webp" alt="" width="736" height="1314" fetchpriority="high">
          </picture>
          <canvas></canvas>
        </div>
        <section id="result" aria-labelledby="result-name" tabindex="-1" hidden>
          <div class="preview"><img id="preview" alt="Converted animation"></div>
          <div class="result-bar">
            <div><h2 id="result-name" data-ascii></h2><span id="result-size"></span></div>
            <div class="result-actions">
              <a id="save" class="secondary" download><span class="icon" aria-hidden="true">[v]</span><span data-ascii>Save</span></a>
              <button id="copy" class="secondary" type="button" hidden><span data-ascii>Copy</span></button>
              <button id="share" class="primary" type="button" hidden><span class="icon" aria-hidden="true">[^]</span><span data-ascii>Share</span></button>
            </div>
          </div>
          <p id="result-help" hidden></p>
        </section>
      </div>
      <span class="drop-hint" aria-hidden="true"><span data-ascii>Drop video</span></span>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
