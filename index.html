<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn an X video into a GIF or animated WebP on your device.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#17191b">
  <title>xgif — X video to GIF and animated stickers</title>
  <link rel="canonical" href="https://wysh3.github.io/xgif/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="xgif — X video to GIF and animated stickers">
  <meta property="og:description" content="Convert public X videos to looping GIFs and animated WebP stickers on your device.">
  <meta property="og:url" content="https://wysh3.github.io/xgif/">
  <meta property="og:image" content="https://wysh3.github.io/xgif/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="xgif, a converter for X videos, GIFs, and animated stickers">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-loop" viewBox="0 0 24 24"><path d="m16 2 4 4-4 4M4 11V9a3 3 0 0 1 3-3h13M8 22l-4-4 4-4m12-1v2a3 3 0 0 1-3 3H4"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="m10 13 4-4m-6.5 6.5-1 1a3.5 3.5 0 0 1-5-5L6 7a3.5 3.5 0 0 1 5 0m5.5 1.5 1-1a3.5 3.5 0 0 1 5 5L18 17a3.5 3.5 0 0 1-5 0" transform="rotate(-180 12 12)"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-paste" viewBox="0 0 24 24"><path d="M8 5H6a2 2 0 0 0-2 2v13a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V7a2 2 0 0 0-2-2h-2M9 3h6a1 1 0 0 1 1 1v3H8V4a1 1 0 0 1 1-1m-1 9h8m-8 4h6"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 19h16.3a2 2 0 0 0 1.9-1.6l1.2-6A2 2 0 0 0 20.5 9H5a2 2 0 0 0-2 2Zm0-8V6a1 1 0 0 1 1-1h5l2 2h7a2 2 0 0 1 2 2"/></symbol>
    <symbol id="icon-trim" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="m8.2 8.2 11.3 11.3m-11.3-3.7L19.5 4.5M12 12h.01"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-share" viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M7 10H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="icon-save" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="icon-source" viewBox="0 0 24 24"><path d="m8 7-5 5 5 5m8-10 5 5-5 5M14 4l-4 16"/></symbol>
  </svg>

  <main class="workspace">
    <div class="collage" aria-hidden="true">
      <div class="crop crop-left"><img src="./loop-study.webp" width="1200" height="800" alt=""></div>
      <div class="crop crop-tall"><img src="./loop-study.webp" width="1200" height="800" alt=""></div>
      <div class="crop crop-main"><img src="./loop-study.webp" width="1200" height="800" alt="" fetchpriority="high"></div>
      <div class="crop crop-strip"><img src="./loop-study.webp" width="1200" height="800" alt=""></div>
      <div class="crop crop-detail"><img src="./loop-study.webp" width="1200" height="800" alt=""></div>
    </div>

    <div class="panel">
      <header class="window-bar">
        <div class="identity">
          <span class="brand-mark" aria-hidden="true"><svg class="icon"><use href="#icon-loop"/></svg></span>
          <h1>xgif<span class="visually-hidden"> — X videos to GIFs and animated stickers</span></h1>
        </div>
        <a class="source-icon-link" href="https://github.com/wysh3/xgif" aria-label="Source code on GitHub" title="Source code on GitHub">
          <svg class="icon" aria-hidden="true"><use href="#icon-source"/></svg>
        </a>
      </header>
      <form id="converter">
        <fieldset id="controls">
          <div class="editor">
            <div class="input-group">
              <label class="visually-hidden" for="post">X post link</label>
              <svg class="icon source-icon" aria-hidden="true"><use id="source-icon" href="#icon-link"/></svg>
              <input id="post" type="url" inputmode="url" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste an X post link" aria-describedby="status">
              <span id="file-name" hidden></span>
              <button class="icon-button" id="remove-file" type="button" aria-label="Remove video" title="Remove video" hidden>
                <svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg>
              </button>
              <button id="convert" class="primary" type="submit" aria-label="Paste &amp; convert">
                <span id="convert-text">Paste</span><svg class="icon" aria-hidden="true"><use id="convert-icon" href="#icon-paste"/></svg>
              </button>
            </div>

            <div class="editor-actions">
              <fieldset class="formats">
                <legend class="visually-hidden">Output format</legend>
                <div class="segments">
                  <label><input type="radio" name="format" value="gif" checked><span>GIF</span></label>
                  <label><input type="radio" name="format" value="webp"><span>Sticker</span></label>
                </div>
              </fieldset>
              <button id="toggle-options" class="quiet" type="button" aria-expanded="false" aria-controls="options">Options</button>
            </div>
          </div>

          <div id="options" class="accessories" hidden>
            <div class="accessory-buttons">
              <button id="choose-video" class="quiet" type="button">
                <svg class="icon" aria-hidden="true"><use href="#icon-folder"/></svg>Open video…
              </button>
              <input id="file" type="file" accept="video/*,.mov,.mkv" hidden>
              <button id="toggle-trim" class="quiet" type="button" aria-expanded="false" aria-controls="trim-options">
                <svg class="icon" aria-hidden="true"><use href="#icon-trim"/></svg>Trim clip
              </button>
            </div>
            <div id="trim-options" class="trim-fields" hidden>
              <label>Start (seconds)<input id="start" type="number" min="0" step="0.1" value="0" required></label>
              <label>Length (seconds)<input id="length" type="number" min="0.5" max="10" step="0.1" value="3" required></label>
            </div>
          </div>
          <div id="clip-picker" class="clip-picker" hidden>
            <label for="clip">Video in post</label>
            <select id="clip"></select>
          </div>
        </fieldset>
      </form>

      <div class="activity">
        <span class="spinner" aria-hidden="true" hidden></span>
        <p id="status" role="status" aria-live="polite"></p>
      </div>

      <section id="result" class="result" aria-labelledby="result-name" tabindex="-1" hidden>
        <div class="preview"><img id="preview" alt="Converted animation"></div>
        <div class="result-toolbar">
          <div class="result-meta">
            <h2 id="result-name"></h2>
            <span id="result-size"></span>
          </div>
          <div class="result-actions">
            <a id="save" class="secondary" download>
              <svg class="icon" aria-hidden="true"><use href="#icon-save"/></svg>Save
            </a>
            <button id="copy" class="secondary" type="button" hidden>
              <svg class="icon" aria-hidden="true"><use href="#icon-copy"/></svg>Copy
            </button>
            <button id="share" class="primary" type="button" hidden>
              <svg class="icon" aria-hidden="true"><use href="#icon-share"/></svg>Share
            </button>
          </div>
        </div>
        <p id="result-help" hidden></p>
      </section>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
